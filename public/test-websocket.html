<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test WebSocket Appwrite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 6px;
            margin-top: 20px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        .log-entry {
            margin-bottom: 8px;
        }
        .log-entry.success {
            color: #4ade80;
        }
        .log-entry.error {
            color: #f87171;
        }
        .log-entry.warning {
            color: #fbbf24;
        }
        .log-entry.info {
            color: #60a5fa;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        .status.connected {
            background: #dcfce7;
            color: #16a34a;
        }
        .status.disconnected {
            background: #fee2e2;
            color: #dc2626;
        }
        .status.testing {
            background: #fef3c7;
            color: #ca8a04;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .alert.info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }
        .alert.warning {
            background: #fef3c7;
            color: #92400e;
            border-left: 4px solid #f59e0b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test WebSocket Appwrite</h1>
        <p class="subtitle">Testez votre connexion WebSocket en production</p>

        <div class="alert info">
            <strong>💡 Info :</strong> Ce test vérifie que votre application peut se connecter correctement à Appwrite via WebSocket.
        </div>

        <div class="input-group">
            <label for="endpoint">Endpoint Appwrite</label>
            <input type="text" id="endpoint" placeholder="https://cloud.appwrite.io/v1" value="https://cloud.appwrite.io/v1">
        </div>

        <div class="input-group">
            <label for="projectId">Project ID</label>
            <input type="text" id="projectId" placeholder="votre_project_id">
        </div>

        <div class="button-group">
            <button id="testBtn" onclick="runTest()">🔍 Lancer le test</button>
            <button onclick="testSimpleConnection()">⚡ Test rapide</button>
            <button onclick="clearLog()">🗑️ Effacer le log</button>
            <button onclick="copyLog()">📋 Copier le log</button>
        </div>

        <div id="status"></div>

        <div id="log" class="log">
            <div class="log-entry info">Prêt à tester. Cliquez sur "Lancer le test" pour commencer.</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0"></script>
    <script>
        let client = null;
        let unsubscribe = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            log('Log effacé', 'info');
        }

        function copyLog() {
            const logText = document.getElementById('log').innerText;
            navigator.clipboard.writeText(logText).then(() => {
                log('Log copié dans le presse-papier', 'success');
            });
        }

        function setStatus(text, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<span class="status ${type}">${text}</span>`;
        }

        async function testSimpleConnection() {
            const endpoint = document.getElementById('endpoint').value;
            const projectId = document.getElementById('projectId').value;

            if (!endpoint || !projectId) {
                log('❌ Veuillez remplir l\'endpoint et le project ID', 'error');
                return;
            }

            clearLog();
            log('🚀 Test de connexion rapide...', 'info');
            setStatus('Test en cours...', 'testing');

            try {
                log(`Endpoint: ${endpoint}`, 'info');
                log(`Project ID: ${projectId}`, 'info');

                const { Client } = Appwrite;
                client = new Client();
                client.setEndpoint(endpoint).setProject(projectId);

                log('✅ Client initialisé', 'success');
                log('Tentative de souscription...', 'info');

                let connected = false;

                unsubscribe = client.subscribe('account', (response) => {
                    connected = true;
                    log('✅ WebSocket connecté avec succès !', 'success');
                    log('Réponse reçue: ' + JSON.stringify(response, null, 2), 'success');
                    setStatus('Connecté', 'connected');
                    
                    if (unsubscribe) {
                        unsubscribe();
                        log('Déconnexion...', 'info');
                    }
                });

                setTimeout(() => {
                    if (!connected) {
                        log('❌ Pas de réponse après 5 secondes', 'error');
                        log('Le WebSocket ne fonctionne pas correctement', 'error');
                        setStatus('Échec', 'disconnected');
                        if (unsubscribe) unsubscribe();
                    }
                }, 5000);

            } catch (error) {
                log('❌ Erreur: ' + error.message, 'error');
                setStatus('Erreur', 'disconnected');
            }
        }

        async function runTest() {
            const endpoint = document.getElementById('endpoint').value;
            const projectId = document.getElementById('projectId').value;

            if (!endpoint || !projectId) {
                log('❌ Veuillez remplir l\'endpoint et le project ID', 'error');
                return;
            }

            clearLog();
            log('🔍 === DÉBUT DU TEST COMPLET ===', 'info');
            setStatus('Test en cours...', 'testing');

            // 1. Vérification de la configuration
            log('\n📋 Étape 1: Vérification de la configuration', 'info');
            log(`  Endpoint: ${endpoint}`, 'info');
            log(`  Project ID: ${projectId}`, 'info');

            if (!endpoint.startsWith('https://')) {
                log('  ⚠️  L\'endpoint devrait utiliser HTTPS', 'warning');
            } else {
                log('  ✅ Endpoint utilise HTTPS', 'success');
            }

            // 2. Test d'accessibilité
            log('\n🌐 Étape 2: Test d\'accessibilité de l\'endpoint', 'info');
            try {
                const response = await fetch(endpoint + '/health');
                if (response.ok) {
                    log('  ✅ Endpoint accessible (Status: ' + response.status + ')', 'success');
                } else {
                    log('  ❌ Endpoint retourne status ' + response.status, 'error');
                }
            } catch (error) {
                log('  ❌ Impossible d\'atteindre l\'endpoint: ' + error.message, 'error');
                log('  Vérifiez que l\'URL est correcte', 'warning');
            }

            // 3. Test WebSocket
            log('\n🔌 Étape 3: Test de connexion WebSocket', 'info');
            log('  Initialisation du client Appwrite...', 'info');

            try {
                const { Client } = Appwrite;
                client = new Client();
                client.setEndpoint(endpoint).setProject(projectId);

                log('  ✅ Client initialisé', 'success');
                log('  Tentative de souscription au canal "account"...', 'info');

                let connected = false;
                let messageReceived = false;

                unsubscribe = client.subscribe('account', (response) => {
                    if (!connected) {
                        connected = true;
                        log('  ✅ WebSocket connecté !', 'success');
                        log('  Type d\'événement: ' + response.events, 'info');
                        messageReceived = true;
                        
                        log('\n🎯 === RÉSULTAT FINAL ===', 'success');
                        log('✅ Configuration: OK', 'success');
                        log('✅ Endpoint accessible: OK', 'success');
                        log('✅ WebSocket: OK', 'success');
                        log('\n🎉 Tous les tests sont passés avec succès !', 'success');
                        setStatus('Tous les tests OK', 'connected');

                        // Déconnexion propre
                        setTimeout(() => {
                            if (unsubscribe) {
                                unsubscribe();
                                log('\n👋 Déconnexion propre effectuée', 'info');
                            }
                        }, 1000);
                    }
                });

                // Timeout
                setTimeout(() => {
                    if (!connected) {
                        log('  ❌ Timeout: Pas de réponse après 8 secondes', 'error');
                        log('\n🎯 === RÉSULTAT FINAL ===', 'error');
                        log('❌ Le WebSocket ne répond pas', 'error');
                        log('\n📋 Solutions possibles:', 'warning');
                        log('  1. Vérifier que "WebSocket Support" est activé dans CapRover', 'warning');
                        log('  2. Vérifier que le domaine est ajouté dans Appwrite Platforms', 'warning');
                        log('  3. Vérifier que "Force HTTPS" est activé', 'warning');
                        log('  4. Consulter les logs de l\'application', 'warning');
                        setStatus('WebSocket ne répond pas', 'disconnected');

                        if (unsubscribe) unsubscribe();
                    }
                }, 8000);

            } catch (error) {
                log('  ❌ Erreur lors de la connexion: ' + error.message, 'error');
                log('\n🎯 === RÉSULTAT FINAL ===', 'error');
                log('❌ Test échoué', 'error');
                setStatus('Erreur', 'disconnected');
            }
        }

        // Auto-remplissage depuis les variables d'environnement si disponible
        window.addEventListener('load', () => {
            log('✨ Outil de test WebSocket Appwrite chargé', 'success');
            log('Remplissez les champs et cliquez sur "Lancer le test"', 'info');
        });
    </script>
</body>
</html>
